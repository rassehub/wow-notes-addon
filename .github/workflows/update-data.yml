# Regenerates GoalNotes/Data from the newest WoW Forever build and opens a pull request
# when anything changed. Quests, NPCs and coordinates come from QuestieDB at runtime and
# need nothing here.
name: Update game data
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/update_db.py
      - run: sudo apt-get install -y lua5.1 && lua5.1 tests/run.lua
      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the files carry the date they were made; that alone is not a change
          if git diff -I 'ns.ItemDBDate' --quiet -- GoalNotes/Data; then exit 0; fi
          build=$(grep -o 'ItemDBBuild = "[^"]*"' GoalNotes/Data/Items.lua | cut -d'"' -f2)
          branch="data/$build"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Update game data to build $build"
          git push origin "$branch"
          { echo "Generated by tools/update_db.py; tests/run.lua passed."; echo; python3 tools/update_db.py --diff HEAD~1; } > "$RUNNER_TEMP/body.md"
          gh pr create --title "Update game data to build $build" --body-file "$RUNNER_TEMP/body.md"
